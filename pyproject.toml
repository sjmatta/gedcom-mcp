[project]
name = "gedcom-server"
version = "1.0.0"
description = "MCP server for querying genealogy data from GEDCOM files"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"
authors = [
    {name = "Stephen Matta", email = "stephen.matta@gmail.com"}
]
keywords = ["genealogy", "gedcom", "mcp", "family-tree", "anthropic", "claude", "genealogy-research"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Sociology :: Genealogy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=4.0.10",
    "PyJWT[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
    "starlette>=1.7.0",
    "ged4py>=0.5.5",
    "rapidfuzz>=3.14.6",
    "jellyfish>=1.2.1",
    "geonamescache>=3.0.2",
    "haversine>=2.9.0",
    "requests>=2.34.2",
    "strands-agents[anthropic]>=1.57.1",
    "python-dotenv>=1.2.3",
    # Tracing / Observability
    "arize-phoenix-otel>=0.17.2",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    # Semantic search (optional - only loaded if SEMANTIC_SEARCH_ENABLED=true)
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "numpy>=2.5.3",
    "arize-otel>=0.14.1",
]

[project.urls]
Homepage = "https://github.com/sjmatta/gedcom-mcp"
Documentation = "https://github.com/sjmatta/gedcom-mcp#readme"
Repository = "https://github.com/sjmatta/gedcom-mcp"
Changelog = "https://github.com/sjmatta/gedcom-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/sjmatta/gedcom-mcp/issues"

[project.scripts]
gedcom-server = "gedcom_server.__main__:main"

[tool.poe.tasks]
serve = "python -m gedcom_server"
test = "pytest tests/ -v"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy gedcom_server"
deps = "deptry ."
check = ["lint", "typecheck", "test"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line length handled separately

[tool.mypy]
python_version = "3.14"
warn_return_any = false  # Many functions return parsed data
warn_unused_ignores = true
disallow_untyped_defs = false  # Start lenient, tighten later
check_untyped_defs = true
disable_error_code = ["import-untyped"]

[tool.deptry]
ignore = ["DEP002"]  # Ignore missing dev dependencies in main code

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=2.3.1",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# Rivendell is CPU-only; do not install CUDA runtimes in the deployment image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
